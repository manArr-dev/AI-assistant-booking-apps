# Continuous delivery:
#   push to main      -> CI -> build & push image -> deploy to staging
#   push tag vX.Y.Z   -> CI -> build & push image -> deploy to production (needs approval)
name: CD

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false   # never cancel a deploy half-way

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  image:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/booking-assistant
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
      - id: ref
        # Deploy by digest: immutable, so what was tested is exactly what runs.
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/booking-assistant@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  staging:
    if: github.ref == 'refs/heads/main'
    needs: image
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      overlay: k8s/overlays/staging
      namespace: booking-staging
      image: ${{ needs.image.outputs.image }}
    secrets: inherit

  production:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      overlay: k8s/overlays/production
      namespace: booking-prod
      image: ${{ needs.image.outputs.image }}
    secrets: inherit
