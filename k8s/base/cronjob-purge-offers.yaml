# Hourly clean-up of expired, unbooked travel offers.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: booking-purge-offers
spec:
  schedule: "17 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app.kubernetes.io/name: booking-assistant
            app.kubernetes.io/component: maintenance
        spec:
          restartPolicy: Never
          serviceAccountName: booking-api
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: purge
              image: booking-assistant
              command: ["python", "migrate.py", "--purge-offers"]
              envFrom:
                - configMapRef:
                    name: booking-config
                - secretRef:
                    name: booking-secrets
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests: { cpu: 20m, memory: 96Mi }
                limits: { memory: 256Mi }
              volumeMounts:
                - { name: tmp, mountPath: /tmp }
          volumes:
            - name: tmp
              emptyDir: {}
