# Only the ingress controller (and pods in this namespace) may reach the API pods.
# Egress stays open: the app calls supplier APIs (e.g. Duffel) and managed Postgres/Redis.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: booking-api-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: booking-assistant
      app.kubernetes.io/component: api
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - podSelector: {}
      ports:
        - port: 8080
          protocol: TCP
