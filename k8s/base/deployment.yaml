apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-api
  labels:
    app.kubernetes.io/name: booking-assistant
    app.kubernetes.io/component: api
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: booking-assistant
      app.kubernetes.io/component: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0          # zero-downtime rollouts
  template:
    metadata:
      labels:
        app.kubernetes.io/name: booking-assistant
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: booking-api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: booking-assistant
              app.kubernetes.io/component: api
      initContainers:
        # Apply schema migrations before the new version starts serving. Concurrent
        # runs (several pods starting) are serialised by a database lock.
        - name: migrate
          image: booking-assistant
          command: ["python", "migrate.py"]
          envFrom:
            - configMapRef:
                name: booking-config
            - secretRef:
                name: booking-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      containers:
        - name: api
          image: booking-assistant
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: booking-config
            - secretRef:
                name: booking-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { memory: 512Mi }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              # Let the ingress stop routing here before uvicorn shuts down.
              exec:
                command: ["python", "-c", "import time; time.sleep(5)"]
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: data, mountPath: /data }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
        - name: data
          emptyDir: { sizeLimit: 16Mi }
